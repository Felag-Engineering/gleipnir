# MCP servers for the todoist-research playbook.
#
# Run from this directory:
#   docker compose up -d
#
# Only the Todoist API token is required — SearXNG runs locally and needs no API key.
# Secrets are loaded from .env in this directory (see README.md § Step 2).

services:

  # Todoist MCP server — reads tasks and adds comments.
  # Repo: https://github.com/stanislavlysenko0912/todoist-mcp-server
  #
  # Memory cap: supergateway in stateless streamable-http mode forks a fresh
  # `npx -y todoist-mcp` child for every tool call. Each cold start re-resolves
  # and loads the package, which briefly spikes RSS. Three rapid calls (search →
  # comment → label-update) can overlap and exceed a tight cap, producing
  # SIGKILL mid-request. 1 GiB has comfortable headroom for the overlap; drop it
  # back to 512 MiB only if you switch supergateway to stateful mode (one
  # long-lived child) so cold starts don't repeat.
  todoist-mcp:
    image: node:22-alpine
    command: >
      npx -y supergateway
      --port 8111
      --outputTransport streamableHttp
      --stdio "npx -y todoist-mcp"
    ports:
      - "8111:8111"
    environment:
      # The todoist-mcp package expects the env var to be named API_KEY.
      - API_KEY=${TODOIST_API_KEY}
    restart: unless-stopped
    mem_limit: 1g

  # SearXNG — self-hosted privacy-respecting meta-search engine. Replaces the
  # old duckduckgo-mcp, which was getting bot-blocked by DuckDuckGo. Port 8113
  # is exposed on the host so you can sanity-check it with
  #   curl 'http://localhost:8113/search?q=test&format=json'
  # If you don't need that, remove the ports block — searxng-mcp talks to it
  # over the compose network regardless.
  searxng:
    image: searxng/searxng:latest
    ports:
      - "8113:8080"
    volumes:
      - ./searxng:/etc/searxng:rw
    restart: unless-stopped
    mem_limit: 512m

  # SearXNG MCP wrapper — exposes SearXNG search and URL-read tools to Gleipnir
  # over streamable HTTP. Native HTTP transport via MCP_HTTP_PORT, so no
  # supergateway shim is needed.
  # Repo: https://github.com/ihor-sokoliuk/mcp-searxng
  searxng-mcp:
    image: isokoliuk/mcp-searxng:latest
    environment:
      - SEARXNG_URL=http://searxng:8080
      - MCP_HTTP_PORT=8112
    ports:
      - "8112:8112"
    depends_on:
      - searxng
    restart: unless-stopped
    mem_limit: 256m
