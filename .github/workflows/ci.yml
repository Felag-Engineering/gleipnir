name: CI

on:
  pull_request:
    branches: [main, plugin-architecture]
  push:
    branches: [main, plugin-architecture]
    # Match semver tags: v1.2.3 and pre-releases like v1.2.3-rc1. The two
    # patterns avoid the false-positives of a single `v*.*.*` glob (which
    # would also match `v1.2.3.4`). GHA glob: `+` is a quantifier for the
    # preceding character, so `[0-9]+` means one-or-more digits.
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'
  # The substrate real-daemon lane is required on PRs that reach it and
  # scheduled otherwise (issue #820). Without the schedule, a week where nobody
  # touched those packages would be a week nobody checked the substrate still
  # works against a real runtime — and drift there comes from the runtime
  # changing underneath us, not only from our diffs.
  schedule:
    - cron: '17 4 * * *'

jobs:
  backend-tests:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Build
        run: go build ./...
        env:
          GOWORK: off

      - name: Test
        run: go test -race -coverprofile=coverage.out -covermode=atomic ./...
        env:
          GOWORK: off

      - name: Coverage summary
        run: go tool cover -func=coverage.out

      - uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: coverage.out
          retention-days: 30

  # Native arm64 build + test. Runs on GitHub's free arm64 runner so we gate
  # ARM correctness per-PR rather than discovering breakage at image-publish
  # time. The build is CGO-free + pure-Go SQLite, so this is a real native run,
  # not emulation. Mirrors backend-tests but without the coverage upload (that
  # job remains the canonical coverage source on amd64).
  backend-tests-arm64:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Build
        run: go build ./...
        env:
          GOWORK: off

      - name: Test
        run: go test -race ./...
        env:
          GOWORK: off

  frontend-tests:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm run test:unit -- --coverage

      - uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/
          retention-days: 30

  frontend-typecheck:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

  sqlc-drift:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: sqlc-dev/setup-sqlc@v4
        with:
          sqlc-version: '1.30.0'

      - name: Regenerate sqlc
        run: sqlc generate

      - name: Check for drift
        run: git diff --exit-code internal/db/

  proto-lint:
    name: Proto lint
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bufbuild/buf-setup-action@v1
        with:
          # Pinned to the Makefile's BUF_VERSION: generated headers carry the
          # buf binary's version, so an unpinned buf reports false drift (#1027).
          version: '1.47.2'
          # Authenticate the buf release download to avoid the unauthenticated
          # GitHub API per-IP rate limit, which intermittently fails setup on
          # busy shared runners before buf ever runs.
          github_token: ${{ secrets.GITHUB_TOKEN }}
      # `buf lint` errors when a module has zero .proto files. The lint gate
      # is intentionally a no-op until #167 lands the proto contracts; skip
      # the invocation entirely while the tree has no .proto files.
      - name: Lint protos (skipped when none present)
        run: |
          if find . -type f -name '*.proto' -not -path './.git/*' | grep -q .; then
            buf lint
          else
            echo "No .proto files in tree; skipping buf lint."
          fi

  # Verify that checked-in stubs in plugin-sdk/gen/ exactly match what
  # `buf generate` would produce from the .proto sources.  Mirrors the
  # sqlc-drift job pattern.  Fails the PR if stubs are stale.
  proto-gen-drift:
    name: Proto gen drift
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: bufbuild/buf-setup-action@v1
        with:
          # Keep in step with BUF_VERSION in the Makefile (#1027).
          version: '1.47.2'
          # See proto-lint: authenticate the release download to dodge the
          # unauthenticated GitHub API rate limit on shared runners.
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      # buf.gen.yaml invokes local codegen plugins (formerly BSR remote
      # plugins, which made generation depend on the BSR service being up —
      # the source of the intermittent 403s, #827). Versions are pinned in
      # the Makefile so CI and `make tools` cannot drift apart.
      - name: Install codegen plugins
        run: make tools

      - name: Regenerate stubs
        run: buf generate

      - name: Check for drift
        run: git diff --exit-code plugin-sdk/gen/

  lint-plugins:
    name: Plugin import boundary
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint /plugins/ imports
        run: make lint-plugins
      - name: Self-test (fixture must fail the lint)
        run: make lint-plugins-self-test
      - name: No vendor names in normative profile/extension text (with self-test)
        run: make lint-profile-vocab

  lint-secret-keys:
    name: No committed private keys
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject tracked Minisign/PEM private keys (with self-test)
        run: make lint-secret-keys

  lint:
    name: Lint (gofmt)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: gofmt
        run: make lint-go-fmt

      # scripts/ci-local-scope.sh decides how much of the *local* merge gate
      # runs, so a regression in it would surface as a green gate that tested
      # less than the developer thought. CI is the only place that can catch
      # that, because CI is the run it cannot narrow.
      - name: Gate scoper self-test
        run: make ci-local-scope-self-test

  # staticcheck was previously local-only (`make lint`), which let dead code and
  # style regressions reach PRs that a local `make lint` would have caught —
  # silent drift between the local vocabulary and the CI gate. The Makefile pins
  # the staticcheck version so a new upstream release can't redden open PRs.
  lint-staticcheck:
    name: Lint (staticcheck)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: staticcheck
        run: make lint-staticcheck

  # Build and test the plugin-sdk module independently of the root module.
  # Uses GOWORK=off so the workspace does not bleed into this job; the
  # replace directive in go.mod is the only cross-module link needed here.
  plugin-sdk-build:
    name: Plugin SDK build
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugin-sdk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: 'plugin-sdk/go.mod'
          cache: true

      - name: Build
        run: go build ./...
        env:
          GOWORK: off

      - name: Test
        run: go test ./...
        env:
          GOWORK: off

      # Examples live in their own go.mod files and resolve plugin-sdk via the
      # repo-root go.work (no replace directive in-tree). Run them in workspace
      # mode from the repo root so the manifest canonicalness test guards
      # against drift in CI, not just locally.
      - name: Test examples (workspace)
        working-directory: ${{ github.workspace }}
        run: |
          go test ./plugin-sdk/examples/minimal-tool/...
          go test ./plugin-sdk/examples/conformance-stub/...

      # Builds the conformance stub image, packages one signed bundle per mode
      # (ephemeral key, removed on exit), and opens each the way the host does.
      - name: Conformance stub bundles smoke
        working-directory: ${{ github.workspace }}
        run: |
          make conformance-stub-bundle
          go test -tags conformance_bundle -run TestConformanceStubBundles ./internal/plugin/loader

      # First-party plugins each live in their own module under ./plugins/,
      # so `go test ./plugins/...` from the workspace root matches no packages
      # (the root module owns nothing there). Iterate over each module instead
      # so future plugins (#233+) are automatically picked up without editing CI.
      - name: Test plugins (workspace)
        working-directory: ${{ github.workspace }}
        run: |
          for dir in plugins/*/; do
            (cd "$dir" && go test ./...)
          done

  storybook-build:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Build Storybook
        run: npm run build-storybook

      - uses: actions/upload-artifact@v4
        with:
          name: storybook
          path: frontend/storybook-static/
          retention-days: 30

  docker-build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # QEMU is needed only for the tiny final runtime stage, whose `apk add`
      # RUN executes as arm64. The heavy Go + frontend builder stages are pinned
      # to BUILDPLATFORM and cross-compile, so they stay native (no emulation).
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      # Build both target platforms (no push) so a cross-compile regression in
      # the Dockerfile fails the PR here rather than at publish time.
      - name: Build Docker image (amd64 + arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          tags: gleipnir:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Boots the cross-compiled arm64 image under QEMU emulation and health-checks
  # it. docker-build above proves arm64 *compiles*; this proves the arm64 binary
  # actually *boots and serves* — the one gap that let a runtime-only arm64
  # regression reach users. Emulated and therefore slow, but this is a single
  # container liveness probe, not a performance test, so the wall-clock cost is
  # a boot plus a health poll. The arm64 layers are already warm in the gha
  # cache from docker-build, so the build step here is a near-instant cache hit.
  arm64-boot:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # setup-qemu-action registers the binfmt handlers that let an amd64 runner
      # exec the arm64 binary; buildx --load needs a single-platform build.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Build arm64 image (load into local docker)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          load: true
          tags: gleipnir:arm64-ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Boot arm64 image and health-check
        run: |
          set -euo pipefail
          docker run -d --name gleipnir-arm64 \
            --platform linux/arm64 \
            -e GLEIPNIR_ENCRYPTION_KEY="$(openssl rand -hex 32)" \
            -p 3000:8080 \
            gleipnir:arm64-ci
          # Emulated arm64 boots slower than native — allow a generous window
          # (45 * 2s = 90s) so QEMU startup jitter can't flake the gate.
          for i in $(seq 1 45); do
            if curl -fsS http://localhost:3000/api/v1/health; then
              echo "arm64 image healthy after ${i} attempt(s)"
              exit 0
            fi
            sleep 2
          done
          echo "::error::gleipnir arm64 image did not boot/serve under QEMU"
          docker logs gleipnir-arm64
          exit 1

      - name: Tear down
        if: always()
        run: docker rm -f gleipnir-arm64 || true

  # Builds and boots the image under Podman (rootless, preinstalled on the
  # ubuntu runner) so we gate Podman compatibility per-PR and don't silently
  # regress it. Build + run rather than `podman compose` to avoid depending on
  # a compose provider being installed on the runner; the compose files
  # themselves are exercised by Docker jobs and identical in shape.
  podman-smoke:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Podman version
        run: podman version

      - name: Build image with Podman
        run: podman build -t localhost/gleipnir:podman-ci .

      - name: Run and health-check
        run: |
          set -euo pipefail
          podman run -d --name gleipnir \
            -e GLEIPNIR_ENCRYPTION_KEY="$(openssl rand -hex 32)" \
            -p 3000:8080 \
            localhost/gleipnir:podman-ci
          # Poll the public health endpoint until it responds (or time out).
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/api/v1/health; then
              echo "healthy after ${i} attempt(s)"
              exit 0
            fi
            sleep 2
          done
          echo "::error::gleipnir did not become healthy under Podman"
          podman logs gleipnir
          exit 1

      - name: Tear down
        if: always()
        run: podman rm -f gleipnir || true

  # The substrate suite is behind a build tag, so no default lane compiles it.
  # A change to a package it imports (internal/db, internal/testutil) could
  # break it while never selecting the daemon job — this catches that in
  # seconds, without needing a socket.
  substrate-build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true
      - name: Vet the substrate suite
        run: go vet -tags substrate ./internal/plugin/substrate/
        env:
          GOWORK: off

  # Builds, vets, and tests the substratev2 tag set (issue #948): the
  # MCP-realignment plugin substrate, compiled in behind -tags substratev2
  # instead of the default (untagged) v1.1 go-plugin substrate. Exactly one
  # pluginSubsystem implementation links into any given binary
  # (main_linkage_test.go / main_linkage_v2_test.go prove it), so this job is
  # the tagged mirror of backend-tests above, not a replacement for it — both
  # must stay green independently until #1005 (G-59, the flip) makes this tag
  # set the only one.
  build-substratev2:
    name: Build (substratev2)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # Least-privilege: this job only checks out and builds/tests — it never
    # pushes, comments, or uploads anything, so it needs no write scope.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Build
        run: go build -tags substratev2 ./...
        env:
          GOWORK: off

      - name: Vet
        run: go vet -tags substratev2 ./...
        env:
          GOWORK: off

      - name: Test
        run: go test -race -tags substratev2 . ./internal/plugin/assembly/...
        env:
          GOWORK: off

      # Mirrors the Makefile's lint-substratev2-build lane so a green CI check
      # and a green local `make lint` mean the same thing.
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.7.0 -tags substratev2 ./...
        env:
          GOWORK: off

  # The relaysmoke suite (issue #931) is behind its own build tag for the same
  # reason: it needs Docker and a live, compose-started Relay fleet, neither
  # of which belongs on a PR. Unlike substrate there is no integration job at
  # all here yet — Relay does not publish images to GHCR
  # (gleipnir-relay#451 item 5), so the nightly/on-demand leg
  # (docs/developer/relay-smoke.md) has to run against a checked-out Relay
  # source tree and is deferred until that lands. This compile-only vet is
  # what keeps the suite from bit-rotting against API drift in
  # internal/mcp, internal/execution/run, and internal/http/api in the
  # meantime.
  relaysmoke-build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true
      - name: Vet the relaysmoke suite
        run: go vet -tags relaysmoke ./internal/relaysmoke/
        env:
          GOWORK: off

  # Decides whether the substrate lane has to run for this PR.
  #
  # The answer comes from scripts/ci-local-scope.sh — the SAME scoper the local
  # gate uses — rather than a `paths:` filter maintained separately in YAML. One
  # source of truth for "does this diff reach the substrate": a second list here
  # would drift from the first, and the failure mode of that drift is a lane
  # that silently stops running for the packages it exists to cover.
  #
  # Also runs on push (a merge to main, or a release tag): there is no PR diff
  # to scope there, and code on those refs is already merged, so the answer is
  # simply "yes" (issue #982) — a push/tag build that skipped the lane would be
  # the exact silent gap the scheduled run below exists to catch, except every
  # week instead of once.
  substrate-scope:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.scope.outputs.run }}
      dood: ${{ steps.scope.outputs.dood }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - id: scope
        name: Ask the scoper whether this diff reaches the substrate
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            # A push to main or a tag push has no base ref to diff against —
            # and nothing to narrow against either, since this ref is already
            # merged. Run the lane unconditionally.
            echo "substrate lane: 1 (${{ github.event_name }}, no diff to scope)"
            echo "run=1" >> "$GITHUB_OUTPUT"
            echo "dood=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
          changed=$(git diff --name-only FETCH_HEAD...HEAD)
          echo "changed files:"; printf '%s\n' "$changed"
          # CI_LOCAL_SCOPE_FILES is the scoper's documented seam, so this asks
          # the same question the local gate asks, with the diff supplied
          # explicitly instead of inferred from the runner's git topology.
          scope_out=$(CI_LOCAL_SCOPE_FILES="$changed" ./scripts/ci-local-scope.sh)
          run=$(printf '%s\n' "$scope_out" | sed -n 's/^CI_LOCAL_RUN_SUBSTRATE=//p')
          dood=$(printf '%s\n' "$scope_out" | sed -n 's/^CI_LOCAL_RUN_DOOD=//p')
          echo "substrate lane: ${run}"
          echo "dood lane: ${dood}"
          echo "run=${run}" >> "$GITHUB_OUTPUT"
          echo "dood=${dood}" >> "$GITHUB_OUTPUT"
        env:
          GOWORK: off

  # The one bounded real-daemon job (ADR-056 §15 "Socket-in-CI test cost").
  #
  # Everything else in this milestone tests against container.Fake, which runs
  # the same self-constraint the real runtime does. What a Fake cannot answer is
  # whether the DAEMON agrees: that a network created Internal really has no
  # route out, that a subnet the allocator carved is one the daemon accepts,
  # that an image GC believes is unreferenced is one the daemon will delete.
  #
  # Bounded at 15 minutes on purpose. The value here is a signal that the
  # substrate still works against a real runtime, not breadth — breadth belongs
  # in the unit suites, which are seconds. A job that grew past this budget
  # would be a job people start skipping.
  substrate-integration:
    needs: substrate-scope
    # always() so a scheduled run — where substrate-scope never ran and is
    # therefore "skipped" — still reaches this job. `github.event_name !=
    # 'pull_request'` (rather than spelling out 'schedule' and 'push') is the
    # belt-and-suspenders half of issue #982: it runs push/tag/schedule even
    # if substrate-scope's own widened trigger above is ever narrowed back.
    if: ${{ always() && (needs.substrate-scope.outputs.run == '1' || github.event_name != 'pull_request') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - uses: ./.github/actions/rootless-podman
      - name: Build the substrate test image
        # Built rather than pulled, because the image has to satisfy two
        # requirements at once and no stock tag does both.
        #
        # It must STAY RUNNING under its default command: the reconciler creates
        # instance containers from a desired-state row, which carries no command
        # override, so the image's own CMD is what runs — and the planner
        # correctly restarts an exited container while the row says `running`. A
        # stock busybox (CMD ["sh"], which exits immediately without a TTY)
        # therefore flaps instead of converging.
        #
        # It must also carry `nc`, because the isolation probe is a container
        # dialing across a network boundary.
        #
        # It must be LOCAL either way: an instance network is Internal, so a
        # container on one cannot pull, and a suite that depended on a pull
        # would be testing the runner's network instead of the substrate.
        run: |
          set -euo pipefail
          podman build -t localhost/gleipnir-substrate:latest -f - <<'EOF'
          FROM docker.io/library/busybox:latest
          CMD ["sleep", "infinity"]
          EOF

      - name: Substrate suite
        run: go test -tags substrate -count=1 -timeout 12m -v ./internal/plugin/substrate/
        env:
          GOWORK: off

      - name: Report leftovers
        if: always()
        # The suite cleans up by label. This says so out loud rather than
        # trusting it silently — a leak here would accumulate on a shared
        # runner image and be invisible until something ran out of address space.
        run: |
          echo "containers:"; podman ps -a --filter 'label=gleipnir.substrate-test-run' --format '{{.Names}}' || true
          echo "networks:";   podman network ls --filter 'label=gleipnir.substrate-test-run' --format '{{.Name}}' || true

      - name: Tear down
        if: always()
        run: |
          podman rm -f $(podman ps -aq --filter 'label=gleipnir.substrate-test-run') 2>/dev/null || true
          podman network prune -f 2>/dev/null || true

  # A scheduled failure has no PR to fail loudly against and no author waiting
  # on a check — left as just a red run in the Actions tab, it is exactly the
  # kind of drift issue #820 exists to catch that would go unseen for weeks.
  # This gives it a paper trail: one pinned tracking issue, appended to on
  # every consecutive nightly failure rather than filing a new one each night.
  substrate-integration-nightly-failure:
    needs: substrate-integration
    if: always() && github.event_name == 'schedule' && needs.substrate-integration.result == 'failure'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: File or update the pinned nightly-failure tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          title="substrate-integration: nightly failure tracking"
          existing=$(gh issue list --repo "${{ github.repository }}" --state open \
            --search "in:title \"$title\"" --json number --jq '.[0].number // empty')
          note="Nightly \`substrate-integration\` run failed: ${RUN_URL} (commit ${{ github.sha }})."
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "${{ github.repository }}" --body "$note"
          else
            gh issue create --repo "${{ github.repository }}" --title "$title" \
              --label bug --label epic:plugin-system \
              --body "$note"$'\n\n'"Pinned tracking issue for \`substrate-integration\` nightly-schedule failures (issue #982) — each consecutive failure appends a comment here instead of filing a new issue. Close it once a nightly run goes green again."
          fi

  # The bounded DooD job (issue #986): the DooD suite (internal/plugin/dood,
  # #985) boots the real v2 assembly inside a runner container that has the
  # rootless Podman socket mounted, installs signed conformance-stub bundles
  # and checks convergence plus network isolation against a real daemon. The
  # substrate suite above proves the runtime primitives; this proves the
  # composed system (assembly -> reconciler -> self-attach -> host endpoint).
  #
  # Gated by the same scoper (substrate-scope's `dood` output, from
  # CI_LOCAL_RUN_DOOD) on PRs, and unconditionally on push, tags and the
  # nightly schedule, the same belt-and-suspenders shape as substrate-integration.
  #
  # Wall time (measured on ubuntu-24.04, rootless podman 4.9.3, 2026-10-16): about
  # 1m bundle build + about 50s suite step (about 40s compiling the test binary,
  # about 6s of test), under 3 minutes for the job. Budget 15 minutes.
  dood:
    needs: substrate-scope
    if: ${{ always() && (needs.substrate-scope.outputs.dood == '1' || github.event_name != 'pull_request') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOWORK: off
      # The suite's daemon is the rootless Podman started below, and the
      # bundles' image archives are loaded into it, so they must be built by
      # Podman too (a Docker-built archive would sit in the wrong store).
      CONTAINER_ENGINE: podman
      DOOD_RUNNER_IMAGE: mirror.gcr.io/library/golang:1.26-alpine
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - uses: ./.github/actions/rootless-podman

      - name: Pull the build and runner base from a mirror
        # Docker Hub rate-limits shared runners. The stub Dockerfile names
        # golang:1.26-alpine, which Podman resolves to docker.io/library/...;
        # tagging the mirror's copy under that name makes the build use the
        # local image instead of pulling. The same image is the suite's runner
        # and probe image, so it is present when instance networks (Internal,
        # unable to pull) need it.
        run: |
          set -euo pipefail
          podman pull "${DOOD_RUNNER_IMAGE}"
          podman tag "${DOOD_RUNNER_IMAGE}" docker.io/library/golang:1.26-alpine

      - name: Build the conformance stub bundles
        run: make conformance-stub-bundle

      - name: Build the slack-v2 bundle
        # The Slack smoke (internal/plugin/dood/slack_smoke_test.go, #997)
        # installs it. Built by Podman for the same reason as the stub bundles.
        run: make slack-v2-bundle

      # TODO(#987): add `make -C plugins/ntfy image archive bundle`
      # (ephemeral key) now that plugins/ntfy is a v2 container with those targets.

      - name: DooD suite
        run: scripts/run-dood-suite.sh

      # TODO(#999): add `go test -tags conform_bundle
      # ./plugin-sdk/cmd/gleipnir-plugin/cmd/` once the conform bundle mode lands.

      - name: Diagnostics on failure
        if: failure()
        # run-dood-suite.sh already dumps the runner and plugin containers'
        # logs before it removes the runner; this adds the daemon's view of what
        # survived.
        run: |
          podman ps -a --format '{{.ID}} {{.Names}} {{.Status}} {{.Image}} {{.Labels}}' || true
          podman network ls || true
          podman volume ls || true
          podman images || true
          podman info || true

      - name: Report leftovers
        if: always()
        # The suite cleans up by label. This says so out loud rather than
        # trusting it silently.
        run: |
          echo "containers:"; podman ps -a --filter 'label=gleipnir.managed=true' --format '{{.Names}}' || true
          podman ps -a --filter 'label=gleipnir.dood-test-run' --format '{{.Names}}' || true
          podman ps -a --filter 'label=gleipnir.dood-runner' --format '{{.Names}}' || true
          echo "networks:";   podman network ls --filter 'label=gleipnir.managed=true' --format '{{.Name}}' || true
          echo "volumes:";    podman volume ls --format '{{.Name}}' | grep '^gleipnir-plugin-' || true

      - name: Tear down
        if: always()
        run: |
          for f in label=gleipnir.managed=true label=gleipnir.dood-test-run label=gleipnir.dood-runner; do
            ids=$(podman ps -aq --filter "$f" 2>/dev/null || true)
            if [ -n "$ids" ]; then podman rm -f $ids 2>/dev/null || true; fi
          done
          podman network prune -f 2>/dev/null || true
          podman volume ls -q 2>/dev/null | grep '^gleipnir-plugin-' | xargs -r podman volume rm -f 2>/dev/null || true

  # Same paper trail as substrate-integration-nightly-failure, for the DooD job.
  dood-nightly-failure:
    needs: dood
    if: always() && github.event_name == 'schedule' && needs.dood.result == 'failure'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: File or update the pinned nightly-failure tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          title="dood: nightly failure tracking"
          existing=$(gh issue list --repo "${{ github.repository }}" --state open \
            --search "in:title \"$title\"" --json number --jq '.[0].number // empty')
          note="Nightly \`dood\` run failed: ${RUN_URL} (commit ${{ github.sha }})."
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "${{ github.repository }}" --body "$note"
          else
            gh issue create --repo "${{ github.repository }}" --title "$title" \
              --label bug --label epic:plugin-system \
              --body "$note"$'\n\n'"Pinned tracking issue for \`dood\` nightly-schedule failures (issue #986) — each consecutive failure appends a comment here instead of filing a new issue. Close it once a nightly run goes green again."
          fi

  # Publishes :dev on every merge to main. Bleeding-edge tag — do not pull
  # this in production. :latest is reserved for the release job below.
  docker-push-dev:
    if: github.event_name == 'push' && github.ref_type == 'branch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # QEMU emulates the arm64 runtime stage's `apk add`; the cross-compiled
      # Go build itself runs natively (see Dockerfile BUILDPLATFORM pins).
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            felagengineering/gleipnir:dev
          # Re-use layers from the previous push; mode=max caches all
          # intermediate stages, not just the final image.
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Publishes :latest and the version tag (e.g. :v1.2.3) when a matching
  # git tag is pushed. A GitHub Release creates a tag as a side effect,
  # so this covers both the CLI and UI release flows.
  docker-push-release:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # QEMU emulates the arm64 runtime stage's `apk add`; the cross-compiled
      # Go build itself runs natively (see Dockerfile BUILDPLATFORM pins).
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            felagengineering/gleipnir:latest
            felagengineering/gleipnir:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  vuln-scan-go:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        run: make security-go

  vuln-scan-frontend:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Run npm audit
        run: make security-frontend
