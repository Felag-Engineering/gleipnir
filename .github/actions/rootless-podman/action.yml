name: Rootless Podman
description: >
  Gives the runner a systemd user session and starts a rootless Podman API
  socket at $XDG_RUNTIME_DIR/podman/podman.sock. Shared by the substrate and
  DooD integration jobs (issues #820, #986). Exports XDG_RUNTIME_DIR and
  DBUS_SESSION_BUS_ADDRESS to later steps.

runs:
  using: composite
  steps:
    - name: Give the runner a systemd user session
      shell: bash
      run: |
        set -euo pipefail
        uid="$(id -u)"

        # Two separate things have to be true before a rootless container can
        # start on a DNS-enabled network, and a bare Actions job has neither.
        #
        # First, a live *user* bus: netavark hands aardvark-dns to
        # `systemd-run --user --scope` whenever the host is systemd-booted.
        # An Actions job is not a login session, so logind has never created
        # /run/user/$uid or the bus inside it. Enabling linger starts
        # user@$uid.service, which creates both — owned by this user, which
        # is also what makes the runtime dir safe to use below.
        #
        # Second, that bus has to be reachable from where netavark actually
        # runs, which is inside podman's rootless-netns mount namespace —
        # and there /run is REPLACED by a prepared directory (see
        # containers/common, libnetwork/internal/rootlessnetns). Exactly
        # three things are carried into it: /run/systemd, the resolv.conf
        # plumbing, and a recursive bind of XDG_RUNTIME_DIR at its own path.
        # So the bus survives into that namespace only when XDG_RUNTIME_DIR
        # is itself under /run. That is why this is /run/user/$uid and not a
        # directory under RUNNER_TEMP: with a temp-dir runtime dir nothing
        # recreates /run/user/$uid inside the namespace, and aardvark-dns
        # dies on `Failed to connect to bus: No such file or directory`
        # however healthy the bus looks from the job shell.
        #
        # None of this was load-bearing while an Internal network came up
        # with DNS disabled, because aardvark-dns was never spawned at all.
        # The runtime on the current runner image keeps DNS enabled on
        # internal networks, which turned both gaps into a container start
        # that fails outright.
        if ! sudo loginctl enable-linger "$(id -un)"; then
          echo "::warning::loginctl enable-linger failed; falling through to the session check"
        fi

        export XDG_RUNTIME_DIR="/run/user/${uid}"
        export DBUS_SESSION_BUS_ADDRESS="unix:path=${XDG_RUNTIME_DIR}/bus"

        # The readiness check ends on netavark's own invocation rather than on
        # the bus socket existing. A runtime dir we do not own, or a bus that
        # refuses --scope, both pass a file check and then surface 12 minutes
        # later as a convergence timeout naming neither systemd nor dbus.
        ready=0
        for i in $(seq 1 30); do
          if [ -O "${XDG_RUNTIME_DIR}" ] && systemd-run --user -q --scope true 2>/dev/null; then
            echo "systemd user session up after ${i}s"
            ready=1
            break
          fi
          sleep 1
        done
        if [ "${ready}" -ne 1 ]; then
          echo "::error::no usable systemd user session; netavark cannot start aardvark-dns"
          ls -ld "${XDG_RUNTIME_DIR}" || true
          systemd-run --user --scope true || true
          exit 1
        fi

        {
          echo "XDG_RUNTIME_DIR=${XDG_RUNTIME_DIR}"
          echo "DBUS_SESSION_BUS_ADDRESS=${DBUS_SESSION_BUS_ADDRESS}"
        } >> "$GITHUB_ENV"

    - name: Start a rootless Podman socket
      shell: bash
      run: |
        set -euo pipefail
        # XDG_RUNTIME_DIR comes from the session step above and has to stay
        # /run/user/$uid — read the mount-namespace reasoning there before
        # moving it back under RUNNER_TEMP. Posture detection builds the
        # podman socket path from it, so it is also what makes DetectPosture
        # resolve rootless-podman rather than falling back to the Docker
        # socket the runner also has.
        #
        # Ordering matters as well: netavark is exec'd by this service and
        # inherits its environment, so the session has to exist first.
        mkdir -p "${XDG_RUNTIME_DIR}/podman"
        podman system service --time=0 "unix://${XDG_RUNTIME_DIR}/podman/podman.sock" &
        for i in $(seq 1 30); do
          if [ -S "${XDG_RUNTIME_DIR}/podman/podman.sock" ]; then
            echo "podman socket up after ${i}s"
            exit 0
          fi
          sleep 1
        done
        echo "::error::rootless podman socket did not appear"
        exit 1
