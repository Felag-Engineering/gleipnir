version: v2

# Local codegen plugins — pinned to exact versions for reproducible stubs;
# `make tools` installs them. Formerly BSR remote plugins, but remote
# generation depends on the BSR service being reachable, which made the
# drift lanes fail (or, worse, pass vacuously — see the exit-code check in
# ci-local-drift) in any environment without BSR access (#827).
# Run `make proto` to regenerate.  The proto-gen-drift CI job verifies that
# checked-in stubs match sources on every pull request.
plugins:
  - local: protoc-gen-go
    out: plugin-sdk/gen
    opt:
      - paths=source_relative

  - local: protoc-gen-go-grpc
    out: plugin-sdk/gen
    opt:
      - paths=source_relative
      - require_unimplemented_servers=false

inputs:
  - directory: plugin-sdk/proto
