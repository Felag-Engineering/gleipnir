version: v2

# BSR remote plugins — pinned to exact versions for reproducible stubs.
# Run `make proto` to regenerate.  The proto-gen-drift CI job verifies that
# checked-in stubs match sources on every pull request.
plugins:
  - remote: buf.build/protocolbuffers/go:v1.36.10
    out: plugin-sdk/gen
    opt:
      - paths=source_relative

  - remote: buf.build/grpc/go:v1.5.1
    out: plugin-sdk/gen
    opt:
      - paths=source_relative
      - require_unimplemented_servers=false

inputs:
  - directory: plugin-sdk/proto
