services:
  api:
    # Fully-qualified registry path (docker.io/…) so Podman resolves it without
    # a short-name prompt — Podman's default registries.conf does not assume
    # docker.io the way Docker does. Docker accepts the qualified form too.
    image: docker.io/felagengineering/gleipnir:latest
    ports:
      - "${GLEIPNIR_PORT:-3000}:8080"
    environment:
      - GLEIPNIR_DB_PATH=${GLEIPNIR_DB_PATH:-/data/gleipnir.db}
      # REQUIRED. Encrypts provider API keys and webhook secrets at rest.
      # Losing this value makes all encrypted data permanently unrecoverable.
      # Back it up (password manager / secrets vault). Rotate with gleipnirctl — see cmd/gleipnirctl/README.md.
      # Generate with: openssl rand -hex 32
      - GLEIPNIR_ENCRYPTION_KEY=${GLEIPNIR_ENCRYPTION_KEY:?GLEIPNIR_ENCRYPTION_KEY must be set. Copy .env.example to .env and fill it in (openssl rand -hex 32).}
      # Directory watched for plugin tarball drop-ins. Backed by a named volume
      # so installed bundles survive container recreation.
      - GLEIPNIR_PLUGINS_DIR=${GLEIPNIR_PLUGINS_DIR:-/plugins}
    volumes:
      - gleipnir_data:/data
      - gleipnir_plugins:/plugins
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  gleipnir_data:
  gleipnir_plugins:
