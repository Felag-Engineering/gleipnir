auth:
  mode: instance_credentials
  oauth_defaults:
    authorization_url: https://slack.com/oauth/v2/authorize
    scopes:
      - channels:history
      - channels:read
      - chat:write
      - groups:history
      - im:history
      - im:write
      - mpim:history
      - users:read
    token_url: https://slack.com/api/oauth.v2.access
  strategy: oauth2_authcode
channels:
  - config_schema:
      properties:
        channel:
          description: 'Slack channel or user DM target (e.g. #general or @username)'
          type: string
          x-gleipnir-options:
            multi: false
            source: channels
        mention:
          description: Slack user or group to mention in the message (e.g. @oncall)
          type: string
        response_buttons:
          description: Custom response buttons for Request messages. Defaults to Approve/Reject if omitted.
          items:
            properties:
              label:
                description: Button label text displayed to the operator
                type: string
              option_id:
                description: Unique identifier for this button option (echoed in feedback_response payload)
                type: string
              style:
                description: 'Button colour: primary (green), danger (red), or default (no colour)'
                enum:
                  - default
                  - primary
                  - danger
                type: string
              value:
                description: Value echoed in feedback_response payload
                type: string
            required:
              - option_id
              - label
              - value
            type: object
          type: array
      required:
        - channel
      type: object
    implements_notify: true
    implements_request: true
config_schema:
  properties:
    app_level_token:
      description: 'Slack app-level token (xapp- prefix) for Socket Mode. Generate in Slack admin: Settings → Socket Mode → Generate token with scope connections:write.'
      type: string
      x-gleipnir-secret: true
  required:
    - app_level_token
  type: object
description: 'Slack integration: tools (send/list channels), triggers (channel messages), and channels (notify/request via Slack DMs and posts).'
event_kinds:
  - binding_schema:
      additionalProperties: false
      properties:
        channel_id:
          description: Exact match on the Slack channel. Pick a channel from the searchable list; matches the message's stable channel ID (e.g. C012AB3CD).
          title: Channel
          type: string
          x-gleipnir-options:
            source: channels
        channel_type:
          description: 'Exact match on the Slack channel kind: channel (public), group (private), im (DM), mpim (multi-party DM). Leave empty to match any.'
          title: Channel type
          type: string
        mention_only:
          description: 'Fire only when the bot is explicitly @-mentioned. Note: a DM is never a mention, so this excludes DMs.'
          title: Mention-only
          type: boolean
        text:
          description: Case-sensitive substring; matches anywhere in the message body (not anchored to the start).
          format: contains
          title: Text contains
          type: string
        user:
          description: Exact match (case-sensitive) on the sender's Slack user ID (e.g. U012AB3CD). Leave empty to match all users.
          title: User
          type: string
          x-gleipnir-options:
            source: users
      type: object
    description: A message was posted to a Slack channel
    examples:
      - name: Plain channel message
        payload:
          channel: '#general'
          channel_id: C012ABCDEF
          channel_type: channel
          event_ts: "1700000001.000100"
          mentioned: false
          team_id: T03TEAM001
          text: Lunch order is in.
          ts: "1700000001.000100"
          user: U01USER001
      - name: Bot mention in incidents channel
        payload:
          channel: '#incidents'
          channel_id: C09INCIDENT
          channel_type: channel
          event_ts: "1700001000.000200"
          mentioned: true
          team_id: T03TEAM001
          text: <@U07BOTUSER> the database is degraded
          ts: "1700001000.000200"
          user: U01USER002
      - name: Threaded reply
        payload:
          channel: '#ops'
          channel_id: C09OPSCHAN
          channel_type: channel
          event_ts: "1700002000.000300"
          mentioned: false
          team_id: T03TEAM001
          text: Rolled back the deployment, monitoring now.
          thread_ts: "1700002000.000100"
          ts: "1700002000.000300"
          user: U01USER003
    kind: channel_message
    payload_schema:
      additionalProperties: false
      properties:
        channel:
          description: 'Channel display name (e.g. #incidents) or channel ID when the name is unknown'
          title: Channel
          type: string
        channel_id:
          description: Stable Slack channel identifier (e.g. C01ABC)
          title: Channel ID
          type: string
        channel_type:
          description: 'Slack channel kind: channel (public), group (private), im (DM), mpim (multi-party DM)'
          title: Channel type
          type: string
        event_ts:
          description: Timestamp of the event itself
          title: Event timestamp
          type: string
        mentioned:
          description: True when the bot was explicitly mentioned in the message
          title: Mentioned
          type: boolean
        team_id:
          description: Slack workspace ID (best-effort; may be empty for some event shapes)
          title: Team ID
          type: string
        text:
          description: Plain-text message body
          title: Text
          type: string
        thread_ts:
          description: Parent thread timestamp (present only for threaded replies)
          title: Thread timestamp
          type: string
        ts:
          description: Slack message timestamp (uniquely identifies the message within a channel)
          title: Timestamp
          type: string
        user:
          description: Slack user ID of the sender (empty for bot/system messages)
          title: User
          type: string
      required:
        - channel
        - channel_id
        - text
        - ts
        - event_ts
        - channel_type
        - mentioned
      type: object
  - binding_schema:
      additionalProperties: false
      properties:
        text:
          description: Case-sensitive substring; matches anywhere in the message body (not anchored to the start).
          format: contains
          title: Text contains
          type: string
        user:
          description: Exact match (case-sensitive) on the sender's Slack user ID (e.g. U012AB3CD). Leave empty to match all users.
          title: User
          type: string
          x-gleipnir-options:
            source: users
      type: object
    description: A direct message was sent to the bot
    examples:
      - name: DM to bot
        payload:
          channel: D05DMCHAN
          channel_id: D05DMCHAN
          channel_type: im
          event_ts: "1700003000.000100"
          mentioned: false
          team_id: T03TEAM001
          text: what's on my calendar today?
          ts: "1700003000.000100"
          user: U01USER001
      - name: DM with command
        payload:
          channel: D05DMCHAN
          channel_id: D05DMCHAN
          channel_type: im
          event_ts: "1700003001.000100"
          mentioned: false
          team_id: T03TEAM001
          text: 'deploy: staging'
          ts: "1700003001.000100"
          user: U01USER002
    kind: direct_message
    payload_schema:
      additionalProperties: false
      properties:
        channel:
          description: 'Channel display name (e.g. #incidents) or channel ID when the name is unknown'
          title: Channel
          type: string
        channel_id:
          description: Stable Slack channel identifier (e.g. C01ABC)
          title: Channel ID
          type: string
        channel_type:
          description: 'Slack channel kind: channel (public), group (private), im (DM), mpim (multi-party DM)'
          title: Channel type
          type: string
        event_ts:
          description: Timestamp of the event itself
          title: Event timestamp
          type: string
        mentioned:
          description: True when the bot was explicitly mentioned in the message
          title: Mentioned
          type: boolean
        team_id:
          description: Slack workspace ID (best-effort; may be empty for some event shapes)
          title: Team ID
          type: string
        text:
          description: Plain-text message body
          title: Text
          type: string
        thread_ts:
          description: Parent thread timestamp (present only for threaded replies)
          title: Thread timestamp
          type: string
        ts:
          description: Slack message timestamp (uniquely identifies the message within a channel)
          title: Timestamp
          type: string
        user:
          description: Slack user ID of the sender (empty for bot/system messages)
          title: User
          type: string
      required:
        - channel
        - channel_id
        - text
        - ts
        - event_ts
        - channel_type
        - mentioned
      type: object
  - binding_schema:
      additionalProperties: false
      properties:
        command:
          description: Exact match on the slash command name (e.g. /gleipnir). Leave empty to match any command.
          title: Command
          type: string
        text:
          description: Case-sensitive substring matched anywhere in the command arguments.
          format: contains
          title: Text contains
          type: string
      type: object
    description: A workspace slash command was invoked
    examples:
      - name: Deploy slash command
        payload:
          channel_id: C012ABCDEF
          channel_name: '#ops'
          command: /gleipnir
          response_url: https://hooks.slack.com/commands/T03TEAM001/...
          team_id: T03TEAM001
          text: deploy staging
          trigger_id: trig-1.abc
          user: U01USER001
    kind: slash_command
    payload_schema:
      additionalProperties: false
      properties:
        channel_id:
          description: Slack channel ID where the command was typed
          title: Channel ID
          type: string
        channel_name:
          description: Channel name where the command was typed
          title: Channel name
          type: string
        command:
          description: Slash command name (e.g. /gleipnir)
          title: Command
          type: string
        response_url:
          description: Webhook URL for posting a delayed response (valid for 30 minutes)
          title: Response URL
          type: string
        team_id:
          description: Slack workspace ID
          title: Team ID
          type: string
        text:
          description: Arguments provided after the slash command
          title: Text
          type: string
        trigger_id:
          description: Trigger ID for opening a modal (valid for ~3 seconds)
          title: Trigger ID
          type: string
        user:
          description: Slack user ID of the invoking user (e.g. U012AB3CD)
          title: User
          type: string
      required:
        - command
        - text
      type: object
  - binding_schema:
      additionalProperties: false
      properties:
        callback_id:
          description: Exact match on the message shortcut callback_id registered in Slack (e.g. run_agent_on_message). Leave empty to match any shortcut.
          title: Callback ID
          type: string
      type: object
    description: A message shortcut was invoked on a message
    examples:
      - name: Run agent on incident message
        payload:
          callback_id: run_agent_on_message
          channel_id: C09INCIDENT
          team_id: T03TEAM001
          text: the database is degraded
          trigger_id: trig-2.def
          ts: "1700001000.000200"
          user: U01USER002
    kind: message_shortcut
    payload_schema:
      additionalProperties: false
      properties:
        callback_id:
          description: Shortcut callback_id as registered in Slack app settings
          title: Callback ID
          type: string
        channel_id:
          description: Slack channel ID containing the target message
          title: Channel ID
          type: string
        team_id:
          description: Slack workspace ID
          title: Team ID
          type: string
        text:
          description: Target message text
          title: Text
          type: string
        trigger_id:
          description: Trigger ID for opening a modal (valid for ~3 seconds)
          title: Trigger ID
          type: string
        ts:
          description: Target message Slack timestamp (uniquely identifies the message within a channel)
          title: Timestamp
          type: string
        user:
          description: Slack user ID of the user who invoked the shortcut
          title: User
          type: string
      type: object
  - binding_schema:
      additionalProperties: false
      properties:
        callback_id:
          description: Exact match on the global shortcut callback_id registered in Slack (e.g. start_agent). Leave empty to match any shortcut.
          title: Callback ID
          type: string
      type: object
    description: A global shortcut was invoked
    examples:
      - name: Start agent global shortcut
        payload:
          callback_id: start_agent
          team_id: T03TEAM001
          trigger_id: trig-3.ghi
          user: U01USER003
    kind: global_shortcut
    payload_schema:
      additionalProperties: false
      properties:
        callback_id:
          description: Shortcut callback_id as registered in Slack app settings
          title: Callback ID
          type: string
        team_id:
          description: Slack workspace ID
          title: Team ID
          type: string
        trigger_id:
          description: Trigger ID for opening a modal (valid for ~3 seconds)
          title: Trigger ID
          type: string
        user:
          description: Slack user ID of the user who invoked the shortcut
          title: User
          type: string
      type: object
name: slack
schema_version: v1
services:
  channel: v1
  tool: v1
  trigger: v1
subscription_schema:
  properties:
    channels:
      description: Slack channel IDs (e.g. C012ABCDEF). Empty = watch all. Find IDs in channel settings - About - Channel ID.
      items:
        pattern: ^C[A-Z0-9]+$
        type: string
      title: Channels
      type: array
      x-gleipnir-options:
        multi: true
        source: channels
    direct_messages:
      description: Watch 1:1 DMs to the bot. Channel IDs are not required (DM channel IDs are D...).
      title: Direct messages
      type: boolean
    mention_only:
      description: Only emit when bot is mentioned.
      title: Mention-only
      type: boolean
    shortcuts:
      description: Open the trigger stream so message and global shortcut invocations are delivered. Required for message_shortcut / global_shortcut policies on instances that watch no channels.
      title: Shortcuts
      type: boolean
    slash_commands:
      description: Open the trigger stream so /slash-command invocations are delivered. Required for slash_command policies on instances that watch no channels. Slash commands are never channel-scoped.
      title: Slash commands
      type: boolean
  type: object
tools:
  - description: Post a message to a Slack channel or DM. Supports optional Block Kit blocks alongside plain text.
    input_schema:
      additionalProperties: false
      properties:
        blocks:
          description: JSON array of Slack Block Kit block objects, e.g. [{\"type\":\"section\"
          title: Blocks
        channel:
          description: Channel ID (C…) or name (#general)
          title: Channel
          type: string
        text:
          description: Message text. Used as the notification / fallback text when blocks are present, or as the message body when blocks are absent.
          title: Text
          type: string
        thread_ts:
          description: Optional parent thread timestamp to reply in-thread
          title: Thread TS
          type: string
      required:
        - channel
      type: object
    name: post_message
  - description: List Slack channels visible to the bot user.
    input_schema:
      additionalProperties: false
      properties:
        exclude_archived:
          default: true
          title: Exclude archived
          type: boolean
        limit:
          description: Max channels to return (1-1000). Defaults to 200
          maximum: 1000
          minimum: 1
          title: Limit
          type: integer
        types:
          description: Comma-separated channel types (public_channel,private_channel,mpim,im). Defaults to public_channel.
          title: Types
          type: string
      type: object
    name: list_channels
  - description: Add an emoji reaction to a Slack message.
    input_schema:
      additionalProperties: false
      properties:
        channel:
          description: Channel ID containing the message
          title: Channel
          type: string
        name:
          description: Reaction name without colons (e.g. thumbsup)
          title: Emoji name
          type: string
        timestamp:
          description: Message ts (e.g. 1700000000.123456)
          title: Timestamp
          type: string
      required:
        - channel
        - timestamp
        - name
      type: object
    name: react
  - description: Set the topic of a Slack channel.
    input_schema:
      additionalProperties: false
      properties:
        channel:
          description: Channel ID
          title: Channel
          type: string
        topic:
          description: New channel topic (max 250 chars)
          title: Topic
          type: string
      required:
        - channel
        - topic
      type: object
    name: set_topic
  - description: Read messages in a Slack thread (conversations.replies). Returns messages in chronological order.
    input_schema:
      additionalProperties: false
      properties:
        channel:
          description: Channel ID (C…) containing the thread
          title: Channel
          type: string
        cursor:
          description: Pagination cursor from a previous response
          title: Cursor
          type: string
        limit:
          description: Max messages to return (1-200). Defaults to 200
          maximum: 200
          minimum: 1
          title: Limit
          type: integer
        ts:
          description: Parent message timestamp (ts) that identifies the thread
          title: Thread TS
          type: string
      required:
        - channel
        - ts
      type: object
    name: read_thread
  - description: Read recent messages from a Slack channel (conversations.history). Requires a *:history scope for the channel type.
    input_schema:
      additionalProperties: false
      properties:
        channel:
          description: Channel ID (C…) to read history from
          title: Channel
          type: string
        cursor:
          description: Pagination cursor from a previous response
          title: Cursor
          type: string
        limit:
          description: Max messages to return (1-200). Defaults to 100
          maximum: 200
          minimum: 1
          title: Limit
          type: integer
        oldest:
          description: Return messages after this Unix timestamp (exclusive)
          title: Oldest
          type: string
      required:
        - channel
      type: object
    name: read_history
  - description: Update (edit) a previously posted Slack message. Supports optional Block Kit blocks alongside plain text.
    input_schema:
      additionalProperties: false
      properties:
        blocks:
          description: JSON array of Slack Block Kit block objects, e.g. [{\"type\":\"section\"
          title: Blocks
        channel:
          description: Channel ID containing the message to update
          title: Channel
          type: string
        text:
          description: Message text. Used as the notification / fallback text when blocks are present, or as the message body when blocks are absent.
          title: Text
          type: string
        ts:
          description: Timestamp of the message to update
          title: Message TS
          type: string
      required:
        - channel
        - ts
      type: object
    name: update_message
  - description: Delete a Slack message posted by the bot.
    input_schema:
      additionalProperties: false
      properties:
        channel:
          description: Channel ID containing the message to delete
          title: Channel
          type: string
        ts:
          description: Timestamp of the message to delete
          title: Message TS
          type: string
      required:
        - channel
        - ts
      type: object
    name: delete_message
  - description: Look up a Slack user by ID (U… format). Returns id, name, real_name, and tz.
    input_schema:
      additionalProperties: false
      properties:
        user:
          description: Slack user ID (U… format) to look up
          title: User ID
          type: string
      required:
        - user
      type: object
    name: lookup_user
version: 0.1.1
